<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 350 210" width="350" height="210">
  <!-- 定义渐变和滤镜 -->
  <defs>
    <!-- 连接线渐变 -->
    <linearGradient id="lineGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#22d3ee" />
    </linearGradient>
    
    <!-- 数据点渐变 -->
    <linearGradient id="dataPointGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    
    <!-- 控制面板渐变 -->
    <linearGradient id="controlPanelGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    
    <!-- 阴影滤镜 -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.3" />
    </filter>
    
    <!-- 节点通用滤镜 -->
    <filter id="nodeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="1" dy="1" stdDeviation="1" flood-color="#000" flood-opacity="0.2" />
    </filter>
  </defs>
  
  <!-- 中央控制塔 -->
  <g transform="translate(175, 105)">
    <rect x="-40" y="-40" width="80" height="80" rx="5" fill="url(#controlPanelGradient)" filter="url(#shadow)" />
    
    <!-- 控制面板 -->
    <rect x="-30" y="-30" width="60" height="12" rx="2" fill="#3b82f6" opacity="0.7" />
    <rect x="-30" y="-12" width="60" height="12" rx="2" fill="#10b981" opacity="0.7" />
    <rect x="-30" y="6" width="60" height="12" rx="2" fill="#f59e0b" opacity="0.7" />
    <rect x="-30" y="24" width="60" height="12" rx="2" fill="#ef4444" opacity="0.7" />
    
    <!-- 控制按钮 -->
    <circle cx="-20" cy="-38" r="3" fill="#22d3ee" />
    <circle cx="0" cy="-38" r="3" fill="#10b981" />
    <circle cx="20" cy="-38" r="3" fill="#ef4444">
      <animate attributeName="opacity" values="1;0.5;1" dur="2s" repeatCount="indefinite" />
    </circle>
    
    <!-- 状态指示器 -->
    <circle cx="-25" cy="35" r="2" fill="#22d3ee" />
    <circle cx="-15" cy="35" r="2" fill="#22d3ee" />
    <circle cx="-5" cy="35" r="2" fill="#22d3ee" />
    <circle cx="5" cy="35" r="2" fill="#22d3ee" />
    <circle cx="15" cy="35" r="2" fill="#22d3ee" />
    <circle cx="25" cy="35" r="2" fill="#ef4444">
      <animate attributeName="opacity" values="1;0.3;1" dur="3s" repeatCount="indefinite" />
    </circle>
  </g>
  
  <!-- 数据连接线 -->
  <g>
    <path d="M70,50 C100,40 130,45 140,70" fill="none" stroke="url(#lineGradient)" stroke-width="1.5" stroke-dasharray="4,2" />
    <path d="M137,72 L140,70 L137,68" fill="url(#lineGradient)" />
    <path d="M280,50 C250,40 220,45 210,70" fill="none" stroke="url(#lineGradient)" stroke-width="1.5" stroke-dasharray="4,2" />
    <path d="M213,72 L210,70 L213,68" fill="url(#lineGradient)" />
    <path d="M70,160 C100,170 130,165 140,140" fill="none" stroke="url(#lineGradient)" stroke-width="1.5" stroke-dasharray="4,2" />
    <path d="M137,142 L140,140 L137,138" fill="url(#lineGradient)" />
    <path d="M280,160 C250,170 220,165 210,140" fill="none" stroke="url(#lineGradient)" stroke-width="1.5" stroke-dasharray="4,2" />
    <path d="M213,142 L210,140 L213,138" fill="url(#lineGradient)" />
  </g>
  
  <!-- 数据节点（定制图形） -->
  <g>
    <!-- 1. 设备图案：工业机床 -->
    <g transform="translate(70, 50)">
      <rect x="-14" y="-14" width="28" height="28" rx="2" fill="#1e293b" stroke="url(#lineGradient)" stroke-width="1" filter="url(#nodeShadow)" />
      <rect x="-10" y="-10" width="20" height="4" fill="url(#dataPointGradient)" />
      <rect x="-8" y="-6" width="16" height="8" fill="url(#dataPointGradient)" opacity="0.8" />
      <path d="M-4,2 L4,2 M-2,4 L2,4" stroke="url(#dataPointGradient)" stroke-width="1.5" />
      <path d="M-6,-10 L-6,-6 M6,-10 L6,-6" stroke="url(#lineGradient)" stroke-width="1" />
      <text x="0" y="25" font-family="Arial, sans-serif" font-size="7" text-anchor="middle" fill="white" opacity="0.8">设备监控</text>
    </g>
    
    <!-- 2. 排计划：甘特图 -->
    <g transform="translate(280, 50)">
      <rect x="-14" y="-14" width="28" height="28" rx="2" fill="#1e293b" stroke="url(#lineGradient)" stroke-width="1" filter="url(#nodeShadow)" />
      <rect x="-10" y="-8" width="18" height="4" fill="url(#dataPointGradient)" />
      <rect x="-10" y="-2" width="14" height="4" fill="url(#dataPointGradient)" opacity="0.7" />
      <rect x="-10" y="4" width="10" height="4" fill="url(#dataPointGradient)" opacity="0.5" />
      <path d="M-12,-12 L12,-12 M-12,12 L12,12" stroke="url(#lineGradient)" stroke-width="1" />
      <text x="0" y="25" font-family="Arial, sans-serif" font-size="7" text-anchor="middle" fill="white" opacity="0.8">生产计划</text>
    </g>
    
    <!-- 3. 质量检查：放大镜+对勾 -->
    <g transform="translate(70, 160)">
      <rect x="-14" y="-14" width="28" height="28" rx="2" fill="#1e293b" stroke="url(#lineGradient)" stroke-width="1" filter="url(#nodeShadow)" />
      <circle cx="6" cy="6" r="8" stroke="url(#dataPointGradient)" stroke-width="2" fill="none" />
      <path d="M6,6 L12,12" stroke="url(#dataPointGradient)" stroke-width="2" />
      <path d="M-6,-2 L2,6 L10,-2" stroke="url(#dataPointGradient)" stroke-width="2" fill="none" />
      <text x="0" y="25" font-family="Arial, sans-serif" font-size="7" text-anchor="middle" fill="white" opacity="0.8">质量控制</text>
    </g>
    
    <!-- 4. 仓库：货架+箱子 -->
    <g transform="translate(280, 160)">
      <rect x="-14" y="-14" width="28" height="28" rx="2" fill="#1e293b" stroke="url(#lineGradient)" stroke-width="1" filter="url(#nodeShadow)" />
      <path d="M-10,-8 L10,-8 M-10,0 L10,0 M-10,8 L10,8" stroke="url(#dataPointGradient)" stroke-width="1.5" />
      <rect x="-8" y="-6" width="4" height="4" fill="url(#dataPointGradient)" />
      <rect x="0" y="-6" width="4" height="4" fill="url(#dataPointGradient)" />
      <rect x="8" y="-6" width="4" height="4" fill="url(#dataPointGradient)" />
      <rect x="-8" y="2" width="4" height="4" fill="url(#dataPointGradient)" />
      <rect x="0" y="2" width="4" height="4" fill="url(#dataPointGradient)" />
      <rect x="8" y="2" width="4" height="4" fill="url(#dataPointGradient)" />
      <text x="0" y="25" font-family="Arial, sans-serif" font-size="7" text-anchor="middle" fill="white" opacity="0.8">物料管理</text>
    </g>
  </g>
  
  <!-- 数据流动动画 -->
  <circle cx="70" cy="50" r="2" fill="white">
    <animateMotion dur="8s" repeatCount="indefinite">
      <mpath xlink:href="#path1" />
    </animateMotion>
  </circle>
  <circle cx="280" cy="50" r="2" fill="white">
    <animateMotion dur="8s" repeatCount="indefinite" begin="2s">
      <mpath xlink:href="#path2" />
    </animateMotion>
  </circle>
  <circle cx="70" cy="160" r="2" fill="white">
    <animateMotion dur="8s" repeatCount="indefinite" begin="4s">
      <mpath xlink:href="#path3" />
    </animateMotion>
  </circle>
  <circle cx="280" cy="160" r="2" fill="white">
    <animateMotion dur="8s" repeatCount="indefinite" begin="6s">
      <mpath xlink:href="#path4" />
    </animateMotion>
  </circle>
  <defs>
    <path id="path1" d="M70,50 C100,40 130,45 140,70 C175,105 175,105 175,105 C210,140 220,165 250,170 C280,160 280,160 280,160" fill="none" />
    <path id="path2" d="M280,50 C250,40 220,45 210,70 C175,105 175,105 175,105 C140,140 130,165 100,170 C70,160 70,160 70,160" fill="none" />
    <path id="path3" d="M70,160 C100,170 130,165 140,140 C175,105 175,105 175,105 C210,70 220,45 250,40 C280,50 280,50 280,50" fill="none" />
    <path id="path4" d="M280,160 C250,170 220,165 210,140 C175,105 175,105 175,105 C140,70 130,45 100,40 C70,50 70,50 70,50" fill="none" />
  </defs>
  
</svg>